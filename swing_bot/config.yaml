# ============================================================
# Utility position bot 002 — MACD/RSI swing strategy
# ============================================================
# Buys a dip once momentum turns up (MACD bullish cross while RSI is low), holds
# through pullbacks, and only exits after a run overheats (RSI >= overbought) and
# then fades. Settings chosen from full-history backtests (2019+). Paper by default.

dry_run: true
display_name: "Utility position bot 002"   # shown in the banner + push alerts

watchlist:
  - "XLM-USD"
  - "HBAR-USD"
  - "XRP-USD"
  - "AVAX-USD"
  - "LINK-USD"
  - "ONDO-USD"
  - "FLR-USD"
  - "HYPE-USD"

capital:
  total_usd: 500          # split equally across the watchlist (one cash bucket per coin)

# BUY: MACD line crosses ABOVE its signal line (momentum turning up) while RSI is
# below rsi_buy_max — i.e. buy a dip that's turning, don't chase strength.
# Indicators are standard: MACD 12/26/9, RSI 14 (daily candles).
entry:
  rsi_buy_max: 40           # only buy when RSI is below this (buy the dip-turn)

# SELL: once RSI has reached rsi_overbought since entry (a run has overheated),
# sell when price fades trail_pct from its peak. NO downside stop — it holds
# through pullbacks and only exits after a hot run rolls over. (Full-history
# sweet spot: RSI<40 buy, overbought 75, 10% fade — "buy dips and ride long".)
exit:
  rsi_overbought: 75        # arm the sell once RSI reaches this
  trail_pct: 10             # then sell when price fades this % off its peak

# Risk protections (ported from Freqtrade's plugin patterns). Entry-only — they
# can only BLOCK a buy, never open/close/resize — so they only add caution.
protections:
  stoploss_guard:
    enabled: true
    lookback_hours: 72          # swing trades are slower, so use a wider window than the stoploss bot
    trade_limit: 3              # halt entries after this many losing exits in the window
    required_profit_usd: 0.0    # an exit counts as "losing" when its P&L <= this
  max_drawdown:
    enabled: true
    max_drawdown_pct: 20        # stop buying once equity is 20% below its high-water mark
    cooldown_hours: 12          # then PAUSE this long and resume from a reset baseline

# Liquidity pairlist filter — skip thin/wide-spread coins (checked only at buy time).
liquidity:
  enabled: true
  min_24h_volume_usd: 2000000
  max_spread_pct: 0.6

# Runtime
poll_seconds: 900          # check for newly-completed candles every 15 min
fee_pct: 0.6               # simulated taker fee (paper)
state_file: "swing_portfolio.json"
