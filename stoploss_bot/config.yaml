# ============================================================
# Real-time Trailing Stop-Loss Bot — Configuration
# ============================================================

# SAFETY FIRST: dry_run = true means NO real orders are sent. The bot keeps a
# *simulated* portfolio and proves the strategy on paper. Run it like this for
# weeks before ever setting dry_run: false. (Same discipline as the daily bot.)
dry_run: true

# Watchlist — Coinbase product ids (BASE-QUOTE, quoted in USD). In dynamic
# universe mode (below) this is NO LONGER the trade list: it's the minute-data
# logging set (keeps the price database stable) and the fallback if trending
# selection ever fails. In fixed mode it IS the trade list.
watchlist:
  - "XLM-USD"
  - "HBAR-USD"
  - "XRP-USD"
  - "AVAX-USD"
  - "LINK-USD"
  - "ONDO-USD"
  - "FLR-USD"
  - "HYPE-USD"

# Trading universe — which coins the bot may OPEN new positions in.
#   mode: "fixed"            -> trade the watchlist above (original behaviour)
#         "dynamic_trending" -> trade the top-N trending Coinbase USD pairs,
#                               re-picked every `refresh_minutes`.
# Ranked by 24h gain but only among coins clearing the volume floor, so thin
# flash-pumps are screened out. Held positions are ALWAYS managed to their normal
# trailing-stop exit even after a coin drops out of the list — only new entries
# are gated to the current universe.
universe:
  mode: "dynamic_trending"
  size: 10                       # trade the top 10
  rank_by: "gain_24h"            # "gain_24h" (trending up) or "volume_24h" (most active)
  min_24h_volume_usd: 5000000    # only rank coins with at least this much 24h $ volume
  refresh_minutes: 120           # re-pick the list this often

# Capital & sizing
risk:
  total_capital_usd: 500       # max capital the bot may touch
  max_positions: 3             # never hold more than this many coins at once
  per_position_usd: 150        # capital committed per entry (0 = capital / max_positions)
  min_trade_usd: 25            # skip trades smaller than this (dust / fee churn)

# Entry: "buy the dip" relative to a recent rolling high
entry:
  dip_pct: 3.0                 # buy when price is this % below the recent high
  lookback_minutes: 60         # window used to measure that recent high
  rebuy_cooldown_minutes: 30   # after a stop-out, wait this long before re-entering the SAME coin
  # Trend filter: only buy a dip when the coin is ALSO trending up (price above
  # its moving average). Keeps the bot out of "falling knife" entries during
  # downtrends; backtested far better than the plain dip-buy in choppy markets.
  trend_filter:
    enabled: true
    ma_hours: 12               # moving-average window that defines "the trend"

# Exit: trailing stop from the peak price since entry
exit:
  trail_pct: 10.0              # sell if price falls this % below its peak since entry
                               # (widened from 5%: swing analysis showed the median
                               # pullback is ~8.6%, so 5% whipsawed out of normal dips)
  take_profit_pct: 0           # optional hard take-profit from entry price (0 = off)

# Risk protections (ported from Freqtrade's plugin patterns). These only ever
# BLOCK new entries — they can never open, close, or resize a position — so they
# can only make the bot more cautious. All optional and independently toggleable.
protections:
  # Pause new entries after a burst of losing exits (a bad-regime circuit-breaker).
  stoploss_guard:
    enabled: true
    lookback_hours: 24          # window to count recent losses over
    trade_limit: 3              # halt entries once this many losing exits fall in the window
    required_profit_usd: 0.0    # an exit counts as "losing" when its P&L <= this
  # Halt new entries while total equity sits this far below its all-time peak.
  max_drawdown:
    enabled: true
    max_drawdown_pct: 20        # e.g. 20 = stop buying once down 20% from the high-water mark
    cooldown_hours: 12          # then PAUSE this long and resume from a reset baseline
                                # (not a permanent lockout)

# Liquidity pairlist filter — skip an entry when the coin is too thin or its
# bid/ask spread is too wide (checked only when a buy is otherwise imminent).
liquidity:
  enabled: true
  min_24h_volume_usd: 2000000   # need at least this much 24h USD volume to enter
  max_spread_pct: 0.6           # skip if the bid/ask spread is wider than this %

# Price feed — Coinbase public market-data websocket (no API key required)
feed:
  ws_url: "wss://ws-feed.exchange.coinbase.com"
  channel: "ticker"
  staleness_timeout_s: 90      # force a reconnect if no message arrives for this long

# Paper-trading simulation (only used when dry_run: true)
paper:
  state_file: "paper_portfolio.json"   # persisted simulated cash + positions
  fee_pct: 0.6                         # simulated taker fee per trade (~Coinbase small-volume)

# Housekeeping / logging
log:
  equity_snapshot_seconds: 300   # append an equity_history.csv row at most this often
  heartbeat_seconds: 60          # print a status line at most this often

# Minute-bar price database — aggregates the live tick stream into one OHLC row
# per minute per coin, appended to <dir>/<PRODUCT>.csv. Run backfill_minute_data.py
# once to include history from before logging started. Data files are gitignored
# (they grow large); download them from the server with scp.
data_log:
  enabled: true
  dir: "minute_data"
