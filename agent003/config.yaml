# ============================================================
# Blue-chip position bot 003 — MACD/RSI swing (majors + liquid alts)
# ============================================================
# A duplicate of Agent 002's strategy on a different coin set. Runs the SAME code
# (swing_bot/bot.py) with this config and its own state folder — so any strategy
# change to Agent 002 automatically applies here too.

dry_run: false        # LIVE (real money) — gated by the live block below + API keys
display_name: "Blue-chip position bot 003"   # shown in the banner + push alerts

watchlist:
  - "BTC-USD"
  - "SOL-USD"
  - "ETH-USD"
  - "ZEC-USD"
  - "ADA-USD"
  - "SUI-USD"
  - "LTC-USD"
  - "ICP-USD"

capital:
  total_usd: 400          # real USDC canary capital (~$50/coin); leaves a buffer under $404 for fees

# BUY: MACD line crosses ABOVE its signal line (momentum turning up) while RSI is
# below rsi_buy_max — i.e. buy a dip that's turning, don't chase strength.
# Indicators are standard: MACD 12/26/9, RSI 14 (daily candles).
entry:
  rsi_buy_max: 40           # only buy when RSI is below this (buy the dip-turn)

# SELL: once RSI has reached rsi_overbought since entry (a run has overheated),
# sell when price fades trail_pct from its peak. NO downside stop — it holds
# through pullbacks and only exits after a hot run rolls over.
exit:
  rsi_overbought: 75        # arm the sell once RSI reaches this
  trail_pct: 10             # then sell when price fades this % off its peak

# Risk protections — entry-only, can only BLOCK a buy.
protections:
  stoploss_guard:
    enabled: true
    lookback_hours: 72
    trade_limit: 3
    required_profit_usd: 0.0
  max_drawdown:
    enabled: true
    max_drawdown_pct: 20
    cooldown_hours: 12

# Liquidity pairlist filter — skip thin/wide-spread coins (checked only at buy time).
liquidity:
  enabled: true
  min_24h_volume_usd: 2000000
  max_spread_pct: 0.6

# Runtime
poll_seconds: 900
fee_pct: 0.6
state_file: "swing_portfolio.json"

# ---- LIVE trading (real money) — ACTIVE for this bot ----
# Real orders require ALL of: dry_run:false (above), live_trading:true, and the
# API keys in the env (COINBASE_API_KEY + COINBASE_API_SECRET_FILE via the service).
# Kill-switch: create /opt/crypto-agent/agent003/HALT to freeze live orders.
live:
  live_trading: true       # this bot IS live
  quote_currency: USDC     # trade -USDC pairs (account holds USDC); data stays -USD
  seed_baseline: true      # on first live run, market-buy each coin's bucket once
  max_order_usd: 120       # single-order ceiling (~$50 buckets, so this is headroom)
  fill_poll_seconds: 2
  fill_poll_tries: 30
